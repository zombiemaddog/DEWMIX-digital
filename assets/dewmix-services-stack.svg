<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">DEWMIX services and stack blueprint</title>
  <desc id="desc">Blueprint-style DEWMIX service system on a baked dark blue panel background.</desc>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#71dfff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06101d"/>
      <stop offset="1" stop-color="#09233c"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#21c7f7"/><stop offset="1" stop-color="#0b82df"/>
    </linearGradient>
  </defs>
  <rect width="980" height="620" fill="url(#panel)"/>
  <rect width="980" height="620" fill="url(#grid)"/>
  <g opacity="0.55" fill="none" stroke="#21c7f7" stroke-width="2">
    <circle cx="490" cy="310" r="232"/><circle cx="490" cy="310" r="154"/><circle cx="490" cy="310" r="76"/>
    <path d="M82 310h816M490 66v488M176 146l628 328M176 474l628-328"/>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-weight="800">
    <rect x="366" y="214" width="248" height="192" rx="30" fill="#ffffff" fill-opacity="0.07" stroke="#8aefff" stroke-opacity="0.46"/>
    <text x="421" y="300" font-size="34" fill="#f4f8fb">DEWMIX</text>
    <text x="410" y="340" font-size="18" fill="#8aefff" letter-spacing="2">CONNECTED STACK</text>
    <g fill="#dff8ff" font-size="17">
      <g transform="translate(92 118)"><rect width="198" height="74" rx="20" fill="#21c7f7" fill-opacity="0.12" stroke="#21c7f7"/><text x="26" y="45">Web + Apps</text></g>
      <g transform="translate(690 118)"><rect width="198" height="74" rx="20" fill="#21c7f7" fill-opacity="0.12" stroke="#21c7f7"/><text x="26" y="45">Infrastructure</text></g>
      <g transform="translate(76 420)"><rect width="214" height="74" rx="20" fill="#3ee69b" fill-opacity="0.11" stroke="#3ee69b"/><text x="26" y="45">Automation</text></g>
      <g transform="translate(690 420)"><rect width="198" height="74" rx="20" fill="#8aefff" fill-opacity="0.09" stroke="#8aefff"/><text x="26" y="45">Monitoring</text></g>
      <g transform="translate(382 500)"><rect width="216" height="68" rx="20" fill="#ffb84d" fill-opacity="0.10" stroke="#ffb84d"/><text x="34" y="42">Media Layer</text></g>
    </g>
  </g>
  <g fill="url(#blue)">
    <circle cx="290" cy="155" r="7"/><circle cx="690" cy="155" r="7"/><circle cx="290" cy="457" r="7"/><circle cx="690" cy="457" r="7"/><circle cx="490" cy="500" r="7"/>
